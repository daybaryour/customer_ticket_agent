server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream per-request (via the
    # $backend variable below) means a recreated backend container with a new IP
    # does not leave nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The React app calls relative /api/... URLs. The rewrite strips the prefix,
    # so /api/tickets -> http://backend:8000/tickets.
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Knowledge-base uploads are capped at 10 MB per file by the backend.
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }

    # Client-side routes (e.g. /knowledge-base) fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
